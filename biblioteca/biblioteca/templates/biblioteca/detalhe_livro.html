<!DOCTYPE html>
<html>
<head>
    <title>{{ livro.titulo }}</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            padding: 40px;
        }

        .card {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
            text-align: center;
        }

        img {
            width: 200px;
            margin-bottom: 20px;
        }

        a {
            text-decoration: none;
            color: #007bff;
        }
    </style>
</head>
<body>

<div class="card">
    {% if livro.capa %}
        <img src="{{ livro.capa.url }}">
    {% endif %}

    <h1>{{ livro.titulo }}</h1>
    <h2>{{ livro.autor }}</h2>
    <h3>{{ livro.ano_publicacao }}</h3>

    <br>
    <a href="{% url 'listar_livros' %}">← Voltar para lista</a>
</div>

</body>
</html>
